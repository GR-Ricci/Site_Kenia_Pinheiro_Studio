name: CI/CD Frontend

on:
  pull_request:
    branches:
      - master
      - develop

  push:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  checks:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  deploy-preview:
    name: Deploy Preview (develop)
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: gabriel-ricci
      FRONTEND_PREVIEW_ALIAS: site-kenia-pinheiro-studio-develop.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Preview settings
        run: vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Vercel Preview
        run: vercel build --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy Vercel Preview
        id: deploy_preview
        shell: bash
        run: |
          set -euo pipefail

          deployment_url="$(
            vercel deploy \
              --prebuilt \
              --token="${{ secrets.VERCEL_TOKEN }}"
          )"

          echo "Deployment individual criado:"
          echo "$deployment_url"

          if [[ ! "$deployment_url" =~ ^https:// ]]; then
            echo "Não foi possível identificar a URL do deployment."
            exit 1
          fi

          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Assign fixed Preview alias
        run: |
          vercel alias set \
            "${{ steps.deploy_preview.outputs.deployment_url }}" \
            "${FRONTEND_PREVIEW_ALIAS}" \
            --scope="${VERCEL_SCOPE}" \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --yes

          echo "Frontend Preview fixo:"
          echo "https://${FRONTEND_PREVIEW_ALIAS}"

  deploy-production:
    name: Deploy Production (master)
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    environment:
      name: production

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Production settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Vercel Production
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy Vercel Production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"